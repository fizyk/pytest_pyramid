[build-system]
build-backend = "uv_build"
requires = [ "uv-build>=0.12,<0.13" ]

[project]
name = "pytest-pyramid"
version = "1.1.0"
description = "pytest_pyramid - provides fixtures for testing pyramid applications with pytest test suite"
readme = "README.rst"
keywords = [ "pyramid", "pytest", "testing" ]
license = "MIT"
license-files = [ "LICENSE" ]
requires-python = ">=3.10"
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Environment :: Plugins",
    "Environment :: Web Environment",
    "Framework :: Pyramid",
    "Framework :: Pytest",
    "Intended Audience :: Developers",
    "Natural Language :: English",
    "Operating System :: OS Independent",
    "Programming Language :: Python",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Topic :: Software Development :: Testing",
    "Topic :: Software Development :: Testing :: Unit",
]
dependencies = [
    "pyramid",
    "pytest",
    "webtest",
]

[[project.authors]]
name = "Grzegorz Śliwiński"
email = "fizyk+pypi@fizyk.dev"

[project.urls]
"Bug Tracker" = "https://github.com/fizyk/pytest_pyramid/issues"
Changelog = "https://github.com/fizyk/pytest_pyramid/blob/v1.1.0/CHANGES.rst"
Source = "https://github.com/fizyk/pytest_pyramid/"

[project.entry-points]
pytest11.pytest_pyramid = "pytest_pyramid.plugin"

[dependency-groups]
dev = [
    "coverage==7.15.4",
    "mypy==2.3.0",
    "pyramid==2.1.0",
    "pytest==9.1.1",
    "pytest-cov==7.1.0",
    "towncrier==25.8.0",
    "webtest==3.0.7",
]
release = [
    "tbump==6.11.0",
]

[tool.uv.build-backend]
module-name = "pytest_pyramid"
module-root = ""
source-include = [ "CHANGES.rst" ]

[tool.ruff]
target-version = "py310"
line-length = 100

[tool.ruff.lint]
select = [
    "D",   # pydocstyle
    "E",   # pycodestyle
    "F",   # pyflakes
    "I",   # isort
    "FBT", # flake8-boolean-trap
    "TRY", # tryceratops
    "PT",  # flake8-pytest-style
]

[tool.pyproject-fmt]
column_width = 120
indent = 4
keep_full_version = true
generate_python_version_classifiers = false
table_format = "long"
sub_table_spacing = "\n"

[tool.pytest]
pyramid_config = "tests/pyramid.test.ini"
strict_xfail = true
testpaths = [ "tests" ]

[tool.tbump]
before_commit = [ { name = "Build changelog", cmd = "uv run towncrier build --version {new_version} --yes" } ]
field = [ { name = "extra", default = "" } ]

[[tool.tbump.file]]
src = "pytest_pyramid/__init__.py"

[[tool.tbump.file]]
src = "pyproject.toml"
search = 'version = "{current_version}"'

[[tool.tbump.file]]
src = "pyproject.toml"
search = 'Changelog = "https://github.com/fizyk/pytest_pyramid/blob/v{current_version}/CHANGES.rst"'

[tool.tbump.git]
message_template = "Release {new_version}"
tag_template = "v{new_version}"

[tool.tbump.version]
current = "1.1.0"
regex = '''
  (?P<major>\d+)
  \.
  (?P<minor>\d+)
  \.
  (?P<patch>\d+)
  (\-
    (?P<extra>.+)
  )?
  '''

[tool.towncrier]
directory = "newsfragments"
filename = "CHANGES.rst"
issue_format = "`#{issue} <https://github.com/fizyk/pytest_pyramid/issues/{issue}>`_"
single_file = true

[[tool.towncrier.type]]
directory = "break"
name = "Breaking changes"
showcontent = true

[[tool.towncrier.type]]
directory = "depr"
name = "Deprecations"
showcontent = true

[[tool.towncrier.type]]
directory = "feature"
name = "Features"
showcontent = true

[[tool.towncrier.type]]
directory = "bugfix"
name = "Bugfixes"
showcontent = true

[[tool.towncrier.type]]
directory = "docs"
name = "Documentation"
showcontent = true

[[tool.towncrier.type]]
directory = "misc"
name = "Miscellaneous"
showcontent = true
