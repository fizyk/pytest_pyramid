name: Run tests

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

permissions: {}

jobs:
  tests:
    uses: fizyk/actions-reuse/.github/workflows/shared-tests-pytests.yml@a8292e61e765f89badf5420420611c3092922421 # v5.11.1
    with:
      python-versions: '["3.11", "3.12", "3.13", "3.14", "3.15"]'
      dependency-manager: 'uv'
      coverage-run-mode: true
    secrets:
      codecov_token: ${{ secrets.CODECOV_TOKEN }}

  oldest:
    permissions:
      contents: read
    uses: $/.github/workflows/tests-oldest.yml
    secrets:
      codecov_token: ${{ secrets.CODECOV_TOKEN }}
