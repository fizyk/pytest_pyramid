name: Run tests

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

permissions: {}

jobs:
  tests:
    uses: fizyk/actions-reuse/.github/workflows/shared-tests-pytests.yml@fda7c6236777ced9c8947ab7243959ee6aa185e9 # v5.10.3
    with:
      python-versions: '["3.11", "3.12", "3.13", "3.14", "3.15"]'
      dependency-manager: 'uv'
      coverage-run-mode: true
    secrets:
      codecov_token: ${{ secrets.CODECOV_TOKEN }}

  oldest:
    permissions:
      contents: read
    uses: $/.github/workflows/tests-oldest.yml
    secrets:
      codecov_token: ${{ secrets.CODECOV_TOKEN }}
